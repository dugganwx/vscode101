<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — AI Architecture Papers Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Spectral:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="bg-orb orb-a" aria-hidden="true"></div>

    <div class="auth-container">
      <div class="auth-card">
        <p class="eyebrow">SYSTEMS ARCHITECTURE AND INNOVATION</p>
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Register to access the AI Architecture Papers Portal.</p>

        <div id="authError" class="auth-error" role="alert" style="display:none"></div>

        <form method="POST" action="/register" class="auth-form">
          <label class="auth-label" for="username">Username</label>
          <input class="auth-input" type="text" id="username" name="username" required autofocus autocomplete="username" />

          <label class="auth-label" for="password">Password</label>
          <input class="auth-input" type="password" id="password" name="password" required autocomplete="new-password" />

          <label class="auth-label" for="confirm">Confirm Password</label>
          <input class="auth-input" type="password" id="confirm" name="confirm" required autocomplete="new-password" />

          <button class="auth-btn" type="submit">Create Account</button>
        </form>

        <p class="auth-footer">
          Already have an account? <a href="/login">Sign in</a>
        </p>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const err = params.get('error');
      if (err) {
        const el = document.getElementById('authError');
        el.textContent = err;
        el.style.display = 'block';
      }
    </script>
  </body>
</html>
